spring:
  application:
    name: inventory-service
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: inventory-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # inventory-service listens to both "orders" and "payment-events". Both happen to
        # deserialize to the same OrderEvent shape, so one default type covers both listeners.
        spring.json.trusted.packages: "com.example.inventoryservice.model"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.inventoryservice.model.OrderEvent

server:
  port: 8087
