spring:
  application:
    name: shipping-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: shipping-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # The producer tags each message with its own class name. Ignore that header
        # and always deserialize into this service's Order class instead.
        spring.json.trusted.packages: "com.example.shippingservice.model"
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.example.shippingservice.model.Order

server:
  port: 8085
